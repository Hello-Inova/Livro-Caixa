    --panel-hi:#262C36;
    --blue:#0D47FF;
    --blue-2:#2563FF;
    --cyan:#00D4FF;
    --white:#FFFFFF;
    --text:#FFFFFF;
    --text-soft:rgba(255,255,255,0.64);
    --text-faint:rgba(255,255,255,0.36);
    --line:rgba(255,255,255,0.09);
    --line-2:rgba(255,255,255,0.15);
    --grad: linear-gradient(90deg, var(--blue) 0%, var(--cyan) 100%);
    --glow: 0 0 0 1px rgba(0,212,255,0.15), 0 12px 32px rgba(13,71,255,0.18);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 12% 0%, rgba(37,99,255,0.16), transparent 42%),
      radial-gradient(circle at 90% 30%, rgba(0,212,255,0.10), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:2px;
  }
  .wrap{ max-width:1180px; margin:0 auto; padding:32px 20px 90px; }

  /* Header */
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px;
    border-bottom:1px solid var(--line);
    padding-bottom:20px; margin-bottom:26px;
  }
  .masthead h1{
    font-weight:700; font-size:clamp(28px, 4.5vw, 38px); margin:0; letter-spacing:-0.5px;
    background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .masthead p{ margin:6px 0 0; color:var(--text-soft); font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500; }
  .month-nav{ display:flex; align-items:center; gap:10px; }
  .month-nav button{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    width:34px; height:34px; font-size:16px; color:var(--text);
    display:flex; align-items:center; justify-content:center; transition:border-color .15s, background .15s;
  }
  .month-nav button:hover{ background:var(--panel-hi); border-color:var(--cyan); color:var(--cyan); }
  .month-label{ font-weight:600; font-size:14px; min-width:150px; text-align:center; text-transform:capitalize; letter-spacing:0.3px; }

  /* Stat cards */
  .stamps{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
  .stamp-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--blue-2);
    border-radius:12px; padding:16px 18px;
  }
  .stamp-card.c-receber{ border-left-color:var(--cyan); }
  .stamp-card.c-atraso{ border-left-color:var(--blue); background:linear-gradient(135deg, rgba(13,71,255,0.14), var(--panel) 60%); }
  .stamp-card .label{ font-size:11px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text-soft); font-weight:600; }
  .stamp-card .amount{ font-size:22px; font-weight:600; margin-top:6px; }
  .stamp-card.c-pagar .amount{ color:var(--white); }
  .stamp-card.c-receber .amount{ color:var(--cyan); }
  .stamp-card.c-saldo.positivo .amount{ color:var(--cyan); }
  .stamp-card.c-saldo.negativo .amount{ color:var(--white); }
  .stamp-card.c-atraso .amount{ color:var(--white); }

  /* Mini bar chart */
  .flow{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:28px; }
  .flow-title{ font-size:11px; text-transform:uppercase; letter-spacing:1.1px; color:var(--text-soft); font-weight:600; margin-bottom:14px; }
  .flow-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:13px; }
  .flow-row:last-child{ margin-bottom:0; }
  .flow-name{ width:80px; flex-shrink:0; color:var(--text-soft); font-weight:500; }
  .flow-track{ flex:1; background:rgba(255,255,255,0.06); border-radius:6px; height:10px; overflow:hidden; }
  .flow-fill{ height:100%; border-radius:6px; transition:width .5s ease; }
  .flow-fill.receber{ background:linear-gradient(90deg, var(--blue-2), var(--cyan)); }
  .flow-fill.pagar{ background:linear-gradient(90deg, var(--blue), var(--blue-2)); }
  .flow-val{ width:110px; text-align:right; flex-shrink:0; font-weight:600; }

  /* Ledger */
  .ledger{ display:grid; grid-template-columns:1fr 34px 1fr; align-items:stretch; }
  .spine{
    position:relative;
    background-image: linear-gradient(to bottom, transparent, var(--blue-2) 15%, var(--cyan) 50%, var(--blue-2) 85%, transparent);
    background-position:center; background-repeat:no-repeat; background-size:1.5px 100%;
  }
  .spine::before, .spine::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    width:7px; height:7px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 10px 2px rgba(0,212,255,0.6);
  }
  .spine::before{ top:28%; }
  .spine::after{ top:68%; }

  .col{ background:var(--panel); border:1px solid var(--line); padding:20px 20px 24px; min-height:280px; }
  .col.pagar{ border-radius:14px 0 0 14px; border-right:none; }
  .col.receber{ border-radius:0 14px 14px 0; border-left:none; }

  .col-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .col-head h2{ font-weight:600; font-size:17px; margin:0; letter-spacing:0.2px; }
  .col.pagar h2::before{ content:"↓ "; color:var(--blue-2); font-weight:700; }
  .col.receber h2::before{ content:"↑ "; color:var(--cyan); font-weight:700; }
  .add-btn{
    width:32px; height:32px; border-radius:50%; border:none;
    background:var(--grad); color:var(--white); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(13,71,255,0.35); transition:transform .15s, box-shadow .15s;
  }
  .add-btn:hover{ transform:translateY(-1px) scale(1.04); box-shadow:0 6px 18px rgba(0,212,255,0.45); }

  .col-filters{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 14px; }
  .chip{
    font-size:11px; padding:5px 11px; border-radius:20px; border:1px solid var(--line);
    background:transparent; color:var(--text-soft); text-transform:uppercase; letter-spacing:0.4px; font-weight:500;
    transition:border-color .15s, color .15s, background .15s;
  }
  .chip:hover{ border-color:var(--line-2); color:var(--text); }
  .chip.active{ background:var(--blue-2); color:var(--white); border-color:var(--blue-2); }
  .cat-select{
    font-size:11px; padding:4px 9px; border-radius:20px; border:1px solid var(--line);
    background:var(--bg); color:var(--text-soft); font-family:inherit;
  }

  .entries{ border-top:1px solid var(--line); }
  .entry{
    display:grid; grid-template-columns:26px 1fr auto auto auto; align-items:center; gap:10px;
    padding:12px 2px; border-bottom:1px solid var(--line);
  }
  .entry.is-overdue{ background:rgba(13,71,255,0.07); }
  .entry-check{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--text-soft);
    background:transparent; color:var(--bg); font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center; transition:background .15s, border-color .15s;
  }
  .entry.is-done .entry-check{ background:var(--grad); border-color:transparent; color:var(--white); }
  .entry-info{ display:flex; flex-direction:column; min-width:0; }
  .entry-desc{ font-size:14.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry.is-done .entry-desc{ text-decoration:line-through; color:var(--text-faint); }
  .entry-meta{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .entry-value{ font-weight:600; font-size:14px; white-space:nowrap; }
  .value-pagar{ color:var(--text); }
  .value-receber{ color:var(--cyan); }

  .stamp{
    font-size:10px; letter-spacing:0.6px; font-weight:600;
    padding:4px 10px; border-radius:20px;
    text-transform:uppercase; white-space:nowrap;
  }
  .stamp-pendente{ color:var(--blue-2); background:rgba(37,99,255,0.14); border:1px solid rgba(37,99,255,0.35); }
  .stamp-pago{ color:var(--cyan); background:rgba(0,212,255,0.12); border:1px solid rgba(0,212,255,0.35); }
  .stamp-atrasado{ color:var(--white); background:var(--blue); border:1px solid var(--blue); }
  .stamp-atrasado::before{ content:"⚠ "; }

  .entry-actions{ display:flex; gap:4px; }
  .entry-actions button{
    width:24px; height:24px; border:none; background:transparent; color:var(--text-faint); font-size:13px;
    border-radius:6px; transition:background .15s, color .15s;
  }
  .entry-actions button:hover{ background:var(--panel-hi); color:var(--cyan); }

  .empty{
    border:1.5px dashed var(--line-2); border-radius:10px; padding:28px 16px; text-align:center;
    color:var(--text-soft); font-size:13px; margin-top:14px;
  }
  .empty button{
    margin-top:10px; background:var(--grad); color:var(--white); border:none;
    padding:8px 16px; border-radius:20px; font-size:12px; font-weight:600;
  }
  .loading{ text-align:center; color:var(--text-soft); padding:40px 0; font-size:13px; }

  /* Modal */
  .backdrop{
    position:fixed; inset:0; background:rgba(6,12,20,0.68); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .slip{
    background:var(--panel); width:100%; max-width:380px; border-radius:16px;
    padding:28px 24px 24px; position:relative; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,0.5), var(--glow);
    border:1px solid var(--line);
  }
  .slip::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--grad);
  }
  .slip h3{ font-weight:600; margin:0 0 18px; font-size:19px; }
  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.7px; color:var(--text-soft); font-weight:600; }
  .field input, .field select{
    font-family:'Poppins', sans-serif; font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text);
  }
  .field input:focus, .field select:focus{ border-color:var(--cyan); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .slip-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .btn{ border:none; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; transition:opacity .15s, transform .15s; }
  .btn:hover{ opacity:0.9; }
  .btn-ghost{ background:transparent; color:var(--text-soft); }
  .btn-primary{ background:var(--grad); color:var(--white); }
  .btn-danger{ background:transparent; color:var(--blue-2); border:1px solid rgba(37,99,255,0.4); }

  /* Toast */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel-hi); color:var(--white); padding:10px 20px; border-radius:20px;
    font-size:13px; z-index:60; opacity:0; transition:opacity .3s ease;
    pointer-events:none; border:1px solid var(--line-2); box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show{ opacity:1; }

  .footer-note{ text-align:center; margin-top:36px; }
  .footer-note button{
    background:none; border:none; color:var(--text-faint); font-size:11.5px; text-decoration:underline;
  }
  .footer-note button:hover{ color:var(--text-soft); }

  @media (max-width:760px){
    .stamps{ grid-template-columns:1fr 1fr; }
    .ledger{ grid-template-columns:1fr; }
    .spine{ display:none; }
    .col.pagar{ border-radius:14px 14px 0 0; border-right:1px solid var(--line); border-bottom:none; }
    .col.receber{ border-radius:0 0 14px 14px; border-left:1px solid var(--line); margin-top:-1px; }
    .masthead{ flex-direction:column; align-items:flex-start; }
    .entry{ grid-template-columns:22px 1fr auto; row-gap:6px; }
    .entry-value{ grid-column:2; justify-self:start; }
    .stamp{ grid-column:3; grid-row:1 / 3; align-self:center; }
    .entry-actions{ grid-column:2; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Livro-Caixa</h1>
      <p>seu controle pessoal de contas a pagar e a receber</p>
    </div>
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mês anterior">‹</button>
      <span class="month-label" id="monthLabel">—</span>
      <button id="nextMonth" aria-label="Próximo mês">›</button>
    </div>
  </div>

  <div class="stamps" id="stamps"></div>

  <div class="flow">
    <div class="flow-title">Entradas × Saídas do mês</div>
    <div id="flowChart"></div>
  </div>

  <div class="ledger">
    <div class="col pagar">
      <div class="col-head">
        <h2>Contas a Pagar</h2>
        <button class="add-btn" id="addPagar" aria-label="Adicionar conta a pagar">+</button>
      </div>
      <div class="col-filters" id="filtersPagar"></div>
      <div id="listPagar"></div>
    </div>
    <div class="spine"></div>
    <div class="col receber">
      <div class="col-head">
        <h2>Valores a Receber</h2>
        <button class="add-btn" id="addReceber" aria-label="Adicionar valor a receber">+</button>
      </div>
      <div class="col-filters" id="filtersReceber"></div>
      <div id="listReceber"></div>
    </div>
  </div>

  <div class="footer-note">
    <button id="clearAll">apagar todos os dados</button>
  </div>

</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var CATS = {
    pagar: ['Moradia','Transporte','Alimentação','Saúde','Lazer','Educação','Assinaturas','Outros'],
    receber: ['Salário','Freelance','Vendas','Investimentos','Reembolso','Outros']
  };
  var MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var STORAGE_KEY = 'livro-caixa:lancamentos';

  var today = new Date();
  var state = {
    entries: [],
    loaded: false,
    viewYear: today.getFullYear(),
    viewMonth: today.getMonth(),
    filters: {
      pagar: { status:'todas', categoria:'todas' },
      receber: { status:'todas', categoria:'todas' }
    }
  };

  function uid(){ return 'e-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function formatCurrency(v){
    return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }
  function formatDate(iso){
    if(!iso) return '';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }
  function isOverdue(entry){
    return entry.status === 'pendente' && entry.vencimento < todayISO();
  }
  function statusKey(entry){
    if(entry.status === 'concluido') return 'pago';
    if(isOverdue(entry)) return 'atrasado';
    return 'pendente';
  }
  function statusLabel(entry, tipo){
    var k = statusKey(entry);
    if(k === 'pago') return tipo === 'pagar' ? 'Pago' : 'Recebido';
    if(k === 'atrasado') return 'Atrasado';
    return 'Pendente';
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  async function saveEntries(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.entries), false);
    }catch(e){
      showToast('Não foi possível salvar. Tente novamente.');
    }
  }

  async function loadEntries(){
    try{
      var res = await window.storage.get(STORAGE_KEY, false);
      state.entries = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      state.entries = [];
    }
    state.loaded = true;
  }

  // ---------- filtering / derived data ----------
  function entriesForMonth(tipo){
    var y = state.viewYear, m = state.viewMonth;
    return state.entries.filter(function(e){
      if(e.tipo !== tipo) return false;
      var d = e.vencimento.split('-');
      return Number(d[0]) === y && (Number(d[1])-1) === m;
    });
  }

  function applyFilters(list, tipo){
    var f = state.filters[tipo];
    return list.filter(function(e){
      if(f.status !== 'todas'){
        if(f.status === 'concluido' && e.status !== 'concluido') return false;
        if(f.status === 'pendente' && (e.status !== 'pendente' || isOverdue(e))) return false;
        if(f.status === 'atrasado' && !isOverdue(e)) return false;
      }
      if(f.categoria !== 'todas' && e.categoria !== f.categoria) return false;
      return true;
    });
  }

  function sortEntries(list){
    return list.slice().sort(function(a,b){ return a.vencimento < b.vencimento ? -1 : 1; });
  }

  // ---------- rendering ----------
  function render(){
    document.getElementById('monthLabel').textContent = MONTHS[state.viewMonth] + ' ' + state.viewYear;
    renderStamps();
    renderFlow();
    renderColumn('pagar');
    renderColumn('receber');
  }

  function renderStamps(){
    var mesPagar = entriesForMonth('pagar');
    var mesReceber = entriesForMonth('receber');
    var totalPagarPendente = mesPagar.filter(function(e){ return e.status==='pendente'; }).reduce(function(s,e){ return s+Number(e.valor); },0);
    var totalReceberPendente = mesReceber.filter(function(e){ return e.status==='pendente'; }).reduce(function(s,e){ return s+Number(e.valor); },0);
    var saldo = totalReceberPendente - totalPagarPendente;
    var atrasadas = state.entries.filter(isOverdue).length;

    var html = ''
      + '<div class="stamp-card c-pagar"><div class="label">A Pagar (mês)</div><div class="amount num">'+formatCurrency(totalPagarPendente)+'</div></div>'
      + '<div class="stamp-card c-receber"><div class="label">A Receber (mês)</div><div class="amount num">'+formatCurrency(totalReceberPendente)+'</div></div>'
      + '<div class="stamp-card c-saldo '+(saldo>=0?'positivo':'negativo')+'"><div class="label">Saldo Projetado</div><div class="amount num">'+(saldo>=0?'↑ ':'↓ ')+formatCurrency(Math.abs(saldo))+'</div></div>'
      + '<div class="stamp-card c-atraso"><div class="label">Atrasadas (total)</div><div class="amount num">'+atrasadas+'</div></div>';
    document.getElementById('stamps').innerHTML = html;
  }

  function renderFlow(){
    var mesPagar = entriesForMonth('pagar').reduce(function(s,e){ return s+Number(e.valor); },0);
    var mesReceber = entriesForMonth('receber').reduce(function(s,e){ return s+Number(e.valor); },0);
    var max = Math.max(mesPagar, mesReceber, 1);
    var html = ''
      + '<div class="flow-row"><span class="flow-name">Receber</span><div class="flow-track"><div class="flow-fill receber" style="width:'+(mesReceber/max*100)+'%"></div></div><span class="flow-val num">'+formatCurrency(mesReceber)+'</span></div>'
      + '<div class="flow-row"><span class="flow-name">Pagar</span><div class="flow-track"><div class="flow-fill pagar" style="width:'+(mesPagar/max*100)+'%"></div></div><span class="flow-val num">'+formatCurrency(mesPagar)+'</span></div>';
    document.getElementById('flowChart').innerHTML = html;
  }

  function renderColumn(tipo){
    var listEl = document.getElementById(tipo === 'pagar' ? 'listPagar' : 'listReceber');
    var filtersEl = document.getElementById(tipo === 'pagar' ? 'filtersPagar' : 'filtersReceber');

    // filters
    var f = state.filters[tipo];
    var statusOptions = [['todas','Todas'],['pendente','Pendentes'],['concluido', tipo==='pagar'?'Pagas':'Recebidas'],['atrasado','Atrasadas']];
    var chipsHtml = statusOptions.map(function(o){
      return '<button class="chip '+(f.status===o[0]?'active':'')+'" data-tipo="'+tipo+'" data-status="'+o[0]+'">'+o[1]+'</button>';
    }).join('');
    var catOptionsHtml = '<option value="todas">Todas categorias</option>' + CATS[tipo].map(function(c){
      return '<option value="'+c+'" '+(f.categoria===c?'selected':'')+'>'+c+'</option>';
    }).join('');
    filtersEl.innerHTML = chipsHtml + '<select class="cat-select" data-tipo="'+tipo+'">' + catOptionsHtml + '</select>';
    filtersEl.querySelector('.cat-select').value = f.categoria;

    // list
    var list = sortEntries(applyFilters(entriesForMonth(tipo), tipo));

    if(list.length === 0){
      listEl.innerHTML = '<div class="empty">Nenhum lançamento aqui ainda. Adicione '+(tipo==='pagar'?'uma conta a pagar':'um valor a receber')+' para começar.'
        + '<br><button class="empty-add" data-tipo="'+tipo+'">+ Adicionar</button></div>';
      return;
    }

    var rows = list.map(function(e){
      var sk = statusKey(e);
      var done = e.status === 'concluido';
      return '<div class="entry '+(sk==='atrasado'?'is-overdue':'')+' '+(done?'is-done':'')+'" data-id="'+e.id+'">'
        + '<button class="entry-check" data-action="toggle" data-id="'+e.id+'" aria-label="'+(done?'Reabrir':(tipo==='pagar'?'Marcar como pago':'Marcar como recebido'))+'">'+(done?'✓':'')+'</button>'
        + '<div class="entry-info"><span class="entry-desc">'+escapeHtml(e.descricao)+'</span>'
        + '<span class="entry-meta">'+escapeHtml(e.categoria)+' · '+(tipo==='pagar'?'vence ':'previsto ')+formatDate(e.vencimento)+'</span></div>'
        + '<span class="entry-value num '+(tipo==='pagar'?'value-pagar':'value-receber')+'">'+formatCurrency(e.valor)+'</span>'
        + '<span class="stamp stamp-'+sk+'">'+statusLabel(e, tipo)+'</span>'
        + '<div class="entry-actions"><button data-action="edit" data-id="'+e.id+'" aria-label="Editar">✎</button>'
        + '<button data-action="delete" data-id="'+e.id+'" aria-label="Excluir">🗑</button></div>'
        + '</div>';
    }).join('');
    listEl.innerHTML = '<div class="entries">' + rows + '</div>';
  }

  // ---------- modal ----------
  function openModal(tipo, editEntry){
    var isEdit = !!editEntry;
    var cats = CATS[tipo];
    var catOptions = cats.map(function(c){
      return '<option value="'+c+'" '+(isEdit && editEntry.categoria===c ? 'selected':'')+'>'+c+'</option>';
    }).join('');

    var html = ''
      + '<div class="backdrop" id="backdrop">'
      + '  <div class="slip">'
      + '    <h3>'+(isEdit ? 'Editar lançamento' : (tipo==='pagar' ? 'Nova conta a pagar' : 'Novo valor a receber'))+'</h3>'
      + '    <div class="field"><label for="fDesc">Descrição</label><input id="fDesc" type="text" maxlength="60" value="'+(isEdit?escapeHtml(editEntry.descricao):'')+'" placeholder="Ex: Aluguel, Freelance..."></div>'
      + '    <div class="field-row">'
      + '      <div class="field"><label for="fValor">Valor (R$)</label><input id="fValor" type="number" min="0" step="0.01" value="'+(isEdit?editEntry.valor:'')+'" placeholder="0,00"></div>'
      + '      <div class="field"><label for="fData">'+(tipo==='pagar'?'Vencimento':'Previsão')+'</label><input id="fData" type="date" value="'+(isEdit?editEntry.vencimento:'')+'"></div>'
      + '    </div>'
      + '    <div class="field"><label for="fCat">Categoria</label><select id="fCat">'+catOptions+'</select></div>'
      + '    <div class="slip-actions">'
      + (isEdit ? '<button class="btn btn-danger" id="btnDelete">Excluir</button>' : '')
      + '      <button class="btn btn-ghost" id="btnCancel">Cancelar</button>'
      + '      <button class="btn btn-primary" id="btnSave">'+(isEdit?'Salvar':'Adicionar')+'</button>'
      + '    </div>'
      + '  </div>'
      + '</div>';

    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('fDesc').focus();

    document.getElementById('backdrop').addEventListener('click', function(ev){
      if(ev.target.id === 'backdrop') closeModal();
    });
    document.getElementById('btnCancel').addEventListener('click', closeModal);
    if(isEdit){
      document.getElementById('btnDelete').addEventListener('click', function(){
        deleteEntry(editEntry.id);
        closeModal();
      });
    }
    document.getElementById('btnSave').addEventListener('click', function(){
      var desc = document.getElementById('fDesc').value.trim();
      var valor = parseFloat(document.getElementById('fValor').value);
      var data = document.getElementById('fData').value;
      var cat = document.getElementById('fCat').value;

      if(!desc){ showToast('Informe uma descrição.'); return; }
      if(!(valor >= 0)){ showToast('Informe um valor válido.'); return; }
      if(!data){ showToast('Informe uma data.'); return; }

      if(isEdit){
        editEntry.descricao = desc;
        editEntry.valor = valor;
        editEntry.vencimento = data;
        editEntry.categoria = cat;
      }else{
        state.entries.push({
          id: uid(), tipo: tipo, descricao: desc, valor: valor,
          vencimento: data, categoria: cat, status: 'pendente'
        });
      }
      saveEntries();
      closeModal();
      jumpToMonthOf(data);
      render();
      showToast(isEdit ? 'Lançamento atualizado.' : 'Lançamento adicionado.');
    });
  }
  function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }

  function jumpToMonthOf(iso){
    var p = iso.split('-');
    state.viewYear = Number(p[0]);
    state.viewMonth = Number(p[1]) - 1;
  }

  function deleteEntry(id){
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    saveEntries();
    render();
    showToast('Lançamento excluído.');
  }

  function toggleEntry(id){
    var e = state.entries.find(function(x){ return x.id === id; });
    if(!e) return;
    e.status = e.status === 'concluido' ? 'pendente' : 'concluido';
    saveEntries();
    render();
  }

  // ---------- events ----------
  document.getElementById('prevMonth').addEventListener('click', function(){
    state.viewMonth--; if(state.viewMonth<0){ state.viewMonth=11; state.viewYear--; }
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    state.viewMonth++; if(state.viewMonth>11){ state.viewMonth=0; state.viewYear++; }
    render();
  });
  document.getElementById('addPagar').addEventListener('click', function(){ openModal('pagar', null); });
  document.getElementById('addReceber').addEventListener('click', function(){ openModal('receber', null); });

  document.getElementById('clearAll').addEventListener('click', function(){
    if(confirm('Apagar todos os lançamentos? Esta ação não pode ser desfeita.')){
      state.entries = [];
      saveEntries();
      render();
      showToast('Todos os dados foram apagados.');
    }
  });

  ['listPagar','listReceber'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(ev){
      var btn = ev.target.closest('button[data-action]');
      if(btn){
        var eid = btn.getAttribute('data-id');
        var action = btn.getAttribute('data-action');
        if(action === 'toggle') toggleEntry(eid);
        if(action === 'delete') deleteEntry(eid);
        if(action === 'edit'){
          var entry = state.entries.find(function(x){ return x.id === eid; });
          if(entry) openModal(entry.tipo, entry);
        }
        return;
      }
      var addBtn = ev.target.closest('.empty-add');
      if(addBtn) openModal(addBtn.getAttribute('data-tipo'), null);
    });
  });

  ['filtersPagar','filtersReceber'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(ev){
      var chip = ev.target.closest('.chip');
      if(chip){
        var tipo = chip.getAttribute('data-tipo');
        state.filters[tipo].status = chip.getAttribute('data-status');
        renderColumn(tipo);
      }
    });
    document.getElementById(id).addEventListener('change', function(ev){
      if(ev.target.classList.contains('cat-select')){
        var tipo = ev.target.getAttribute('data-tipo');
        state.filters[tipo].categoria = ev.target.value;
        renderColumn(tipo);
      }
    });
  });

  // ---------- init ----------
  async function init(){
    document.getElementById('listPagar').innerHTML = '<div class="loading">Carregando seu livro-caixa…</div>';
    document.getElementById('listReceber').innerHTML = '<div class="loading">Carregando seu livro-caixa…</div>';
    await loadEntries();
    render();
  }
  init();

})();
</script>
</body>
</html>
